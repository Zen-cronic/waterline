<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Waterline deployed bounded-authority architecture</title>
  <desc id="desc">Four stages connect pilot and follower, a protected Cloud Run edge, private intelligence and Cloud SQL authority, and ephemeral Firestore realtime coordination.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131d"/><stop offset="1" stop-color="#0d2029"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123743"/><stop offset="1" stop-color="#0b252f"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a2b19"/><stop offset="1" stop-color="#221d18"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12372f"/><stop offset="1" stop-color="#0b2925"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55d7df"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#e9f4f6}.eyebrow{font-size:17px;font-weight:750;letter-spacing:3px;fill:#5ce2e9}.title{font-size:46px;font-weight:760;letter-spacing:-1.3px}.subtitle{font-size:19px;fill:#9db2ba}.stage-no{font-size:15px;font-weight:800;letter-spacing:2.5px;fill:#5ce2e9}.stage-title{font-size:25px;font-weight:760}.stage-copy{font-size:15px;fill:#94abb4}.card-kicker{font-size:12px;font-weight:800;letter-spacing:1.6px;fill:#5ce2e9}.card-title{font-size:19px;font-weight:740}.card-copy{font-size:13px;fill:#a7bbc2}.code{font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;fill:#7fd9dd}.badge{font-size:11px;font-weight:800;letter-spacing:1.2px}.tiny{font-size:12px;fill:#8da5ae}.edge{fill:none;stroke:#55d7df;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#e6ae57;stroke-width:2.5;stroke-dasharray:9 9}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/><circle cx="1755" cy="85" r="230" fill="#1bb9c2" opacity=".055"/><circle cx="130" cy="1020" r="260" fill="#e6ae57" opacity=".04"/>
  <text x="58" y="58" class="eyebrow">WATERLINE · DEPLOYED ARCHITECTURE</text><text x="58" y="111" class="title">Pilot authority, realtime flight following</text><text x="58" y="146" class="subtitle">Durable aviation decisions stay in Cloud SQL. Firestore carries one-hour coordination only.</text>
  <g transform="translate(1480 48)"><rect width="382" height="86" rx="18" fill="#0a1922" stroke="#29424d"/><circle cx="28" cy="28" r="7" fill="#54cf8e"/><text x="47" y="34" class="badge" fill="#54cf8e">LIVE · US-CENTRAL1</text><text x="20" y="61" class="code">Cloud Run + Vertex AI + Cloud SQL + Firestore</text></g>
  <g filter="url(#shadow)"><rect x="48" y="196" width="410" height="708" rx="26" fill="#0b1b25" stroke="#294651"/><rect x="482" y="196" width="410" height="708" rx="26" fill="#0b1b25" stroke="#2b5960"/><rect x="916" y="196" width="506" height="708" rx="26" fill="#0b1b25" stroke="#715d3c"/><rect x="1446" y="196" width="426" height="708" rx="26" fill="#0b1b25" stroke="#376658"/></g>
  <g transform="translate(72 226)">
    <text class="stage-no">01 · HUMAN LOOP</text><text y="37" class="stage-title">Pilot and follower</text><text y="63" class="stage-copy">One attestation. One possession-bound invitation.</text>
    <g transform="translate(0 92)"><rect width="362" height="124" rx="17" fill="url(#cyan)" stroke="#36727a"/><text x="18" y="29" class="card-kicker">PILOT COCKPIT</text><text x="18" y="59" class="card-title">Evidence + authority map</text><text x="18" y="85" class="card-copy">Reject east v1 · propose west v2</text><text x="18" y="106" class="code">ATTESTATION REQUIRED</text></g><path d="M181 224v38" class="edge"/>
    <g transform="translate(0 272)"><rect width="362" height="118" rx="17" fill="#102833" stroke="#55d7df"/><rect x="18" y="18" width="74" height="74" rx="8" fill="#f4fbfc"/><path d="M29 29h18v18H29zm34 0h18v18H63zM29 63h18v18H29zm30-3h8v8h-8zm12 12h10v10H71z" fill="#0b2029"/><text x="110" y="35" class="card-kicker">SIGNED QR + LINK</text><text x="110" y="64" class="card-title">One-hour capability</text><text x="110" y="88" class="card-copy">No identity, contact, or mutable route</text></g><path d="M181 398v38" class="edge"/>
    <g transform="translate(0 446)"><rect width="362" height="150" rx="17" fill="url(#green)" stroke="#4aae82"/><text x="18" y="29" class="card-kicker">PHONE HANDOFF PAGE</text><text x="18" y="59" class="card-title">Acknowledge + coordinate</text><text x="18" y="85" class="card-copy">Fixed acknowledgement · bounded plain text</text><text x="18" y="111" class="code">HANDOFF READY → FOLLOWING ACTIVE</text><rect x="18" y="124" width="201" height="20" rx="10" fill="#173d34"/><text x="29" y="138" class="badge" fill="#75dca9">RESPONSIBLE FOLLOWER</text></g>
  </g>
  <g transform="translate(506 226)">
    <text class="stage-no">02 · PROTECTED EDGE</text><text y="37" class="stage-title">Cloud Run boundary</text><text y="63" class="stage-copy">Public experience; private mission authority.</text>
    <g transform="translate(0 92)"><rect width="362" height="115" rx="17" fill="url(#cyan)" stroke="#36727a"/><text x="18" y="29" class="card-kicker">PUBLIC CLOUD RUN</text><text x="18" y="58" class="card-title">Next.js application</text><text x="18" y="82" class="card-copy">Cockpit, handoff page, QR and chat UI</text><text x="18" y="101" class="code">waterline-web · public edge</text></g><path d="M181 214v31" class="edge"/>
    <g transform="translate(0 254)"><rect width="362" height="126" rx="17" fill="#102833" stroke="#55d7df"/><text x="18" y="29" class="card-kicker">EXACT MISSION RELAY</text><text x="18" y="58" class="card-title">Signed server command</text><text x="18" y="82" class="card-copy">HttpOnly owner · HMAC method/path/body</text><text x="18" y="104" class="code">Cloud Run IAM ID token → private agent</text></g><path d="M181 388v31" class="edge"/>
    <g transform="translate(0 428)"><rect width="362" height="160" rx="17" fill="url(#green)" stroke="#4aae82"/><text x="18" y="29" class="card-kicker">CHAT AUTHORIZATION BRIDGE</text><text x="18" y="58" class="card-title">Firebase Anonymous Auth</text><text x="18" y="83" class="card-copy">Verify ID token + signed capability</text><text x="18" y="105" class="card-copy">Pilot: owner cookie + terminal mission</text><text x="18" y="127" class="card-copy">Follower: possession → one UID/room</text><text x="18" y="148" class="code">Admin SDK · default credentials</text></g>
  </g>
  <g transform="translate(940 226)">
    <text class="stage-no" fill="#e6ae57">03 · INTELLIGENCE + AUTHORITY</text><text y="37" class="stage-title">Private agents, durable truth</text><text y="63" class="stage-copy">Models read and propose. Code and the pilot decide.</text>
    <g transform="translate(0 92)"><rect width="458" height="112" rx="17" fill="url(#cyan)" stroke="#36727a"/><text x="18" y="29" class="card-kicker">PRIVATE CLOUD RUN · VERTEX AI</text><text x="18" y="58" class="card-title">ADK / Gemini fleet</text><text x="18" y="82" class="card-copy">Route · ingest · corridor · recall · weather · compose · verify</text><text x="18" y="101" class="code">READ / RANK / PROPOSE ONLY</text></g><path d="M229 211v29" class="edge"/>
    <g transform="translate(0 249)"><rect width="458" height="134" rx="17" fill="url(#amber)" stroke="#bc8b47"/><text x="18" y="29" class="card-kicker" fill="#efbc67">DETERMINISTIC VERIFIER</text><text x="18" y="58" class="card-title">Authenticated pilot gate</text><text x="18" y="83" class="card-copy">Digest/schema/geometry/source checks · exact state graph</text><text x="18" y="106" class="card-copy">Only the owner attestation may open the room</text><text x="18" y="125" class="code">MODEL AUTHORITY = 0</text></g><path d="M229 390v29" class="edge"/>
    <g transform="translate(0 428)"><rect width="458" height="160" rx="17" fill="#352819" stroke="#e6ae57" stroke-width="2"/><text x="18" y="29" class="card-kicker" fill="#efbc67">AUTHORITATIVE</text><text x="18" y="61" class="card-title">Cloud SQL · PostGIS · pgvector</text><text x="18" y="88" class="card-copy">Mission state · attestation · append-only events</text><text x="18" y="111" class="card-copy">Spatial corridor · owner memory · one room receipt</text><text x="18" y="134" class="code">status remains dispatched (compatibility)</text><rect x="321" y="18" width="119" height="24" rx="12" fill="#553d1f"/><text x="334" y="34" class="badge" fill="#ffd389">SOURCE OF TRUTH</text></g>
  </g>
  <g transform="translate(1470 226)">
    <text class="stage-no" fill="#75dca9">04 · REALTIME CONSEQUENCE</text><text y="37" class="stage-title">Ephemeral coordination</text><text y="63" class="stage-copy">Direct browser updates under Security Rules.</text>
    <g transform="translate(0 92)"><rect width="378" height="152" rx="17" fill="url(#green)" stroke="#4aae82" stroke-width="2"/><text x="18" y="29" class="card-kicker" fill="#75dca9">EPHEMERAL REAL-TIME COORDINATION</text><text x="18" y="59" class="card-title">Cloud Firestore</text><text x="18" y="84" class="card-copy">One thread · two members · latest 50 messages</text><text x="18" y="107" class="card-copy">500-char text · fixed ack · one-hour TTL</text><text x="18" y="132" class="code">LIVE VIA FIRESTORE</text></g><path d="M189 252v32" class="edge"/>
    <g transform="translate(0 294)"><rect width="378" height="128" rx="17" fill="#102833" stroke="#55d7df"/><text x="18" y="29" class="card-kicker">BIDIRECTIONAL LOOP</text><text x="18" y="58" class="card-title">Acknowledgement + chat</text><text x="18" y="84" class="card-copy">onSnapshot updates laptop and phone instantly</text><text x="18" y="106" class="code">updates/deletes/attachments denied</text></g><path d="M189 430v32" class="edge"/>
    <g transform="translate(0 472)"><rect width="378" height="116" rx="17" fill="#16271f" stroke="#4aae82"/><text x="18" y="29" class="card-kicker" fill="#75dca9">DUPLICATE-SAFE REPLAY</text><text x="18" y="58" class="card-title">Original room returned</text><text x="18" y="82" class="card-copy">Same receipt · QR · token · expiry</text><text x="18" y="101" class="code">one SQL claim · one Firestore thread</text></g>
  </g>
  <path d="M458 535h24" class="edge"/><path d="M892 535h24" class="edge"/><path d="M1422 535h24" class="edge"/><path d="M1417 184v730" class="dash"/>
  <g transform="translate(390 936)"><rect width="1142" height="69" rx="17" fill="#241e17" stroke="#e6ae57" stroke-width="2" stroke-dasharray="9 7"/><text x="571" y="29" text-anchor="middle" class="card-kicker" fill="#efbc67">HARD AUTHORITY BOUNDARY</text><text x="571" y="53" text-anchor="middle" font-size="18" font-weight="760">FIRESTORE MESSAGES CANNOT CHANGE ROUTE, ATTESTATION, OR MISSION STATE</text></g>
  <text x="58" y="1046" class="tiny">Identity: Firebase anonymous UID + signed pilot cookie</text><text x="516" y="1046" class="tiny">Security: Cloud Run IAM + exact HMAC relay + Firestore Rules</text><text x="1136" y="1046" class="tiny">Authority: authenticated pilot + deterministic code + Cloud SQL</text><text x="1680" y="1046" text-anchor="middle" class="tiny">Coordination: Firestore only</text>
</svg>
