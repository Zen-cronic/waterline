services:
  db:
    build:
      context: ./db
    environment:
      POSTGRES_USER: waterline
      POSTGRES_PASSWORD: waterline
      POSTGRES_DB: waterline
    ports:
      - "5455:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - waterline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterline -d waterline"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  waterline_pgdata:
