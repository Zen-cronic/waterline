[project]
name = "waterline-agent"
version = "0.1.0"
description = "Waterline — a live flight briefing for seaplane bases with no station"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk[db]==2.7.1",
    "google-genai>=2.19",
    "psycopg[binary]>=3.2",
    "shapely>=2.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "pg8000>=1.31",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
